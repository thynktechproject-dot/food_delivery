spring:
  datasource:
    url: jdbc:h2:mem:food_delivery_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true

logging:
  level:
    root: WARN
    com.food_delivery.backend: INFO

app:
  cors:
    allowed-origins: http://localhost:3000
  security:
    jwt:
      secret: test-jwt-secret-test-jwt-secret-123456
      expiration-millis: 3600000
      refresh-expiration-millis: 604800000
      issuer: food-delivery-test
  bootstrap-admin:
    enabled: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
